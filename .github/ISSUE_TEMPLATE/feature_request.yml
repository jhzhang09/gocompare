name: Feature request · 功能建议
description: Suggest an idea or improvement · 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem · 要解决的问题
      description: What are you trying to do, and what gets in the way? · 你想完成什么，目前遇到了什么阻碍？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution · 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and references · 替代方案或参考
      description: Other tools or workarounds you know of · 其他工具中的做法或现有的变通办法
