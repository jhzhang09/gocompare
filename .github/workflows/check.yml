name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runner 默认把 LF 转成 CRLF，vendor 文件会与 MyGo 补丁对不上。
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal tools)"
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: git apply --reverse --check patches/mygo-v0.7.3-native.patch
      - run: go vet ./...
      - run: go tool mygo vet .
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile both entry points
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p build
          go build -o build/ ./cmd/gocompare ./cmd/gocompare-cli
      - uses: actions/upload-artifact@v4
        with:
          name: gocompare-${{ matrix.os }}-${{ matrix.arch }}
          path: build/
